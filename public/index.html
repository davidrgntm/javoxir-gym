<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Javoxir Gym</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
<style>
:root {
  /* Layout: sports-app shell — big uppercase condensed headlines, full-bleed photos, pill buttons, 5 bottom tabs; the workout player is always black */
  --bg: #ffffff;
  --soft: #f5f5f5;
  --card: #ffffff;
  --ink: #111111;
  --muted: #707072;
  --line: #e5e5e5;
  --btn: #111111;
  --btn-ink: #ffffff;
  --volt: #d4ff3a;
  --ringc: #111111;
  --volt-ink: #111111;
  --go: #15803d;
  --danger: #d43f21;
  --display: "Anton", "Impact", "Arial Narrow", sans-serif;
  --font: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Segoe UI", Roboto, Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]):not([data-mode="light"]) {
    --bg: #000000; --soft: #161616; --card: #111111; --ink: #ffffff; --muted: #9e9ea0; --line: #262626;
    --btn: #ffffff; --btn-ink: #111111; --go: #3ad27a; --danger: #ff5a3c; --ringc: var(--volt); color-scheme: dark;
  }
}
:root[data-theme="dark"]:not([data-mode="light"]), :root[data-mode="dark"] {
  --bg: #000000; --soft: #161616; --card: #111111; --ink: #ffffff; --muted: #9e9ea0; --line: #262626;
  --btn: #ffffff; --btn-ink: #111111; --go: #3ad27a; --danger: #ff5a3c; --ringc: var(--volt); color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 16px/1.45 var(--font); -webkit-text-size-adjust: 100%; }
h1, h2, h3, p { margin: 0; }
.D { font-family: var(--display); font-weight: 400; text-transform: uppercase; letter-spacing: .01em; line-height: .98; }
h1.D { font-size: 44px; }
h2.D { font-size: 26px; }
h3 { font-size: 17px; font-weight: 700; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--volt); outline-offset: 2px; }
.muted { color: var(--muted); }
.sm { font-size: 14px; } .xs { font-size: 12px; }
.num, input, td, .big { font-variant-numeric: tabular-nums; }
#app { max-width: 620px; margin: 0 auto; min-height: 100vh; }

/* shell */
.page { padding: calc(14px + env(safe-area-inset-top)) 16px calc(100px + env(safe-area-inset-bottom)); display: grid; grid-template-columns: minmax(0, 1fr); gap: 22px; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.sync { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.sync::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.sync.ok::before { background: var(--go); }
.sec { display: grid; gap: 12px; }
.sec-h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.sec-h a, .link { font-size: 14px; font-weight: 600; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; }
.box { background: var(--soft); border-radius: 18px; padding: 16px; display: grid; gap: 12px; }
.pill { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 0 26px; border-radius: 999px; background: var(--btn); color: var(--btn-ink); font-weight: 700; font-size: 16px; }
.pill.block { width: 100%; }
.pill.white { background: #fff; color: #111; }
.pill.volt { background: var(--volt); color: var(--volt-ink); }
.pill.ghost { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--line); }
.pill.sm { min-height: 40px; padding: 0 18px; font-size: 14px; }
.pill.danger { background: transparent; color: var(--danger); box-shadow: inset 0 0 0 1.5px var(--danger); }
.pill[disabled] { opacity: .5; }

/* photos */
.ph { position: relative; display: block; width: 100%; aspect-ratio: 3 / 2; overflow: hidden; background: var(--soft); }
.ph img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.ph.fit img { object-fit: contain; background: #e9e9e9; }
.pl .ph.fit img, .sheet.dark .ph.fit img, .hero .ph.fit img { background: #111; }
.ph .b { animation: swap 2.8s ease-in-out infinite; }
@keyframes swap { 0%, 40% { opacity: 0; } 50%, 90% { opacity: 1; } 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .ph .b { animation: none; opacity: 0; } }
.th { display: block; width: 100%; height: auto; aspect-ratio: 3 / 2; object-fit: cover; background: var(--soft); }

/* hero */
.hero { position: relative; border-radius: 22px; overflow: hidden; background: #111; color: #fff; }
.hero .ph { aspect-ratio: 4 / 5; }
.hero .ph::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0) 30%, rgba(0,0,0,.85) 82%); }
.hero-in { position: absolute; left: 18px; right: 18px; bottom: 18px; z-index: 2; display: grid; gap: 10px; }
.hero-in .tag { font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--volt); }
.hero-in h2 { font-family: var(--display); font-size: 48px; line-height: .95; text-transform: uppercase; }
.hero-in p { color: #d6d6d6; font-size: 15px; }

/* carousels and grids */
.car { display: grid; grid-auto-flow: column; grid-auto-columns: 74%; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; margin: 0 -16px; padding: 0 16px 4px; scrollbar-width: none; }
.car::-webkit-scrollbar { display: none; }
.car > * { scroll-snap-align: start; }
.rc { text-align: left; display: grid; gap: 8px; }
.rc .img { position: relative; border-radius: 16px; overflow: hidden; }
.rc .img .day { position: absolute; left: 10px; top: 10px; background: rgba(0,0,0,.7); color: #fff; font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; }
.rc .img .ok { position: absolute; right: 10px; top: 10px; background: var(--volt); color: #111; font-size: 12px; font-weight: 800; padding: 4px 10px; border-radius: 999px; }
.rc b { font-family: var(--display); font-size: 22px; text-transform: uppercase; line-height: 1; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.xc { text-align: left; display: grid; gap: 6px; }
.xc .th { border-radius: 14px; }
.xc b { font-size: 14px; line-height: 1.25; }
.xc span { font-size: 12px; color: var(--muted); }
.chips { display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px; padding: 0 16px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: 0 0 auto; min-height: 38px; padding: 0 16px; border-radius: 999px; background: var(--soft); font-size: 14px; font-weight: 600; }
.chip[aria-pressed="true"] { background: var(--btn); color: var(--btn-ink); }
.tagx { display: inline-block; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--soft); }
.tagx.volt { background: var(--volt); color: #111; }
.search { width: 100%; height: 48px; border-radius: 999px; border: 0; background: var(--soft); padding: 0 20px; font-size: 16px; }

/* week + goals */
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
.wd { display: grid; gap: 6px; justify-items: center; font-size: 12px; color: var(--muted); font-weight: 600; }
.wd i { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-weight: 700; font-size: 13px; background: var(--card); color: var(--muted); box-shadow: inset 0 0 0 1.5px var(--line); }
.wd i.plan { color: var(--ink); box-shadow: inset 0 0 0 2px var(--ink); }
.wd i.ok { background: var(--volt); color: #111; box-shadow: none; }
.wd.now { color: var(--ink); }
.wd s { width: 6px; height: 6px; border-radius: 50%; }
.wd s.p { background: var(--go); }
.goals { display: grid; grid-template-columns: 96px 1fr; gap: 16px; align-items: center; }
.gl { display: grid; gap: 2px; }
.gi { display: grid; grid-template-columns: 26px 1fr auto; gap: 8px; align-items: center; padding: 6px 0; text-align: left; width: 100%; }
.gi .c { width: 22px; height: 22px; border-radius: 50%; box-shadow: inset 0 0 0 2px var(--line); display: grid; place-items: center; }
.gi .c svg { width: 14px; height: 14px; stroke: #111; fill: none; stroke-width: 3.4; stroke-linecap: round; stroke-linejoin: round; opacity: 0; }
.gi.on .c { background: var(--volt); box-shadow: none; }
.gi.on .c svg { opacity: 1; }
.gi small { color: var(--muted); font-size: 13px; }
.ring text { font-family: var(--display); fill: var(--ink); }
.ring .tr { stroke: var(--line); }
.bar12 { display: grid; grid-template-columns: repeat(12, 1fr); gap: 3px; }
.bar12 i { height: 6px; border-radius: 3px; background: var(--line); }
.bar12 i.past { background: var(--ink); }
.bar12 i.now { background: var(--volt); box-shadow: inset 0 0 0 1px rgba(0,0,0,.15); }

/* stats, lists */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stats.four { grid-template-columns: repeat(2, 1fr); }
.st { background: var(--soft); border-radius: 16px; padding: 14px 12px; display: grid; gap: 2px; }
.st b { font-family: var(--display); font-size: 28px; font-weight: 400; line-height: 1; }
.st span { font-size: 12px; color: var(--muted); }
.li { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); text-align: left; width: 100%; }
.li:last-child { border-bottom: 0; }
.li .lt { width: 64px; height: auto; flex: 0 0 64px; border-radius: 10px; aspect-ratio: 3 / 2; object-fit: cover; background: var(--soft); }
.li .grow { flex: 1; min-width: 0; display: grid; gap: 2px; }
.li small { color: var(--muted); font-size: 13px; }
.up { color: var(--go); font-weight: 700; white-space: nowrap; }
.field { display: grid; gap: 6px; }
.field label { font-size: 13px; color: var(--muted); }
.field input, .field select { height: 46px; border: 0; border-radius: 12px; background: var(--card); box-shadow: inset 0 0 0 1.5px var(--line); padding: 0 14px; font-size: 16px; font-weight: 600; width: 100%; min-width: 0; }
.row3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; padding: 6px 4px; border-bottom: 1px solid var(--line); }
td { padding: 9px 4px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
.tbl { overflow-x: auto; }
.pos { color: var(--go); } .neg { color: var(--danger); }
.note { background: var(--soft); border-left: 4px solid var(--volt); border-radius: 12px; padding: 12px 14px; font-size: 14px; }
svg.chart { width: 100%; height: auto; display: block; }
svg.chart text { fill: var(--muted); font: 600 11px var(--font); }
svg.chart .grid { stroke: var(--line); }
svg.chart .ln { fill: none; stroke: var(--ink); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
svg.chart .ln2 { fill: none; stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 4 3; }
svg.chart .dot { fill: var(--bg); stroke: var(--ink); stroke-width: 2; }
svg.chart .end { fill: var(--volt); stroke: var(--ink); stroke-width: 2; }
svg.chart .endlab { fill: var(--ink); font-weight: 800; font-size: 12px; }
svg.chart .bar { fill: var(--ink); }
svg.chart .bar.z { fill: var(--line); }
svg.chart .bar.now { fill: var(--volt); stroke: var(--ink); stroke-width: 1; }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); }
.badges { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px 10px; }
.bd { display: grid; justify-items: center; gap: 6px; text-align: center; }
.bd .m { width: 72px; height: 72px; border-radius: 50%; display: grid; place-items: center; background: var(--soft); color: var(--muted); font-family: var(--display); font-size: 22px; box-shadow: inset 0 0 0 2px var(--line); }
.bd.on .m { background: #111; color: var(--volt); box-shadow: inset 0 0 0 3px var(--volt); }
.bd b { font-size: 12px; line-height: 1.2; }
.bd small { font-size: 11px; color: var(--muted); }
.photos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.photos button { position: relative; aspect-ratio: 3 / 4; border-radius: 10px; overflow: hidden; background: var(--soft); }
.photos img { width: 100%; height: 100%; object-fit: cover; display: block; }
.photos span { position: absolute; left: 6px; bottom: 6px; background: rgba(0,0,0,.65); color: #fff; font-size: 11px; padding: 2px 6px; border-radius: 6px; }
.water { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; }
.water button { aspect-ratio: 1 / 1.4; border-radius: 6px 6px 10px 10px; box-shadow: inset 0 0 0 2px var(--line); }
.water button.on { background: #3aa0ff; box-shadow: none; }
.foods { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.food { text-align: left; background: var(--soft); border-radius: 14px; padding: 10px 12px; display: grid; gap: 2px; min-height: 58px; }
.food b { font-size: 14px; } .food small { font-size: 12px; color: var(--muted); }
.x { width: 34px; height: 34px; border-radius: 50%; background: var(--soft); font-size: 18px; flex: 0 0 34px; }
.set-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.set-row:last-child { border-bottom: 0; }
.seg { display: inline-flex; background: var(--soft); border-radius: 999px; padding: 3px; }
.seg button { padding: 7px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; }
.seg button[aria-pressed="true"] { background: var(--btn); color: var(--btn-ink); }
.sw { width: 50px; height: 30px; border-radius: 999px; background: var(--line); position: relative; flex: 0 0 50px; }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: left .15s; }
.sw[aria-checked="true"] { background: var(--go); }
.sw[aria-checked="true"]::after { left: 23px; }

/* tabs */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--bg); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
.tabs .in { max-width: 620px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
.tabs a { display: grid; justify-items: center; gap: 3px; padding: 9px 2px 8px; font-size: 11px; font-weight: 600; color: var(--muted); text-decoration: none; }
.tabs a svg { width: 25px; height: 25px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.tabs a[aria-current="page"] { color: var(--ink); }
.resume { position: fixed; left: 10px; right: 10px; bottom: calc(68px + env(safe-area-inset-bottom)); z-index: 30; max-width: 600px; margin: 0 auto; background: var(--volt); color: #111; border-radius: 999px; padding: 12px 18px; display: flex; justify-content: space-between; gap: 10px; font-weight: 700; box-shadow: 0 10px 26px rgba(0,0,0,.25); }

/* player (always dark) */
.pl { --ringc: var(--volt); --ink: #fff; --muted: #a1a1a3; --line: #2b2b2b; --soft: #1a1a1a; --card: #111; --btn: #fff; --btn-ink: #111; background: #000; color: #fff; min-height: 100vh; min-height: 100dvh; display: grid; grid-template-columns: minmax(0, 1fr); align-content: start; padding-bottom: calc(24px + env(safe-area-inset-bottom)); }
.pl-top { position: sticky; top: 0; z-index: 5; background: #000; padding: calc(8px + env(safe-area-inset-top)) 12px 8px; display: grid; grid-template-columns: 44px 1fr 44px; gap: 10px; align-items: center; }
.ib { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: #1a1a1a; color: #fff; }
.ib svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.segs { display: grid; gap: 4px; }
.segs button { height: 5px; border-radius: 3px; background: #333; }
.segs button.ok { background: var(--volt); }
.segs button.now { background: #fff; }
.pl-meta { display: flex; justify-content: space-between; padding: 0 16px 10px; font-size: 13px; color: #a1a1a3; }
.pl-meta b { color: #fff; font-variant-numeric: tabular-nums; }
.pl .ph { aspect-ratio: 3 / 2; }
.pl-body { padding: 16px; display: grid; gap: 14px; }
.pl-step { font-size: 13px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--volt); }
.pl-name { font-family: var(--display); font-size: 40px; line-height: .98; text-transform: uppercase; }
.pl-sub { color: #a1a1a3; font-size: 14px; margin-top: -6px; }
.steppers { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stp { background: #161616; border-radius: 18px; padding: 10px; display: grid; gap: 4px; justify-items: center; }
.stp.solo { grid-column: 1 / -1; }
.stp label { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: #a1a1a3; }
.stp .rowx { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; width: 100%; gap: 4px; }
.stp .v { font-family: var(--display); font-size: 46px; line-height: 1; text-align: center; font-variant-numeric: tabular-nums; }
.stp .pm { width: 44px; height: 44px; border-radius: 50%; background: #2a2a2a; color: #fff; font-size: 24px; font-weight: 600; }
.pl-info { display: grid; gap: 6px; font-size: 14px; color: #cfcfd1; }
.pl-acts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.pl-acts button { min-height: 44px; border-radius: 999px; background: #1a1a1a; font-size: 13px; font-weight: 600; color: #fff; }
.setdots { display: flex; gap: 6px; }
.setdots i { width: 28px; height: 6px; border-radius: 3px; background: #333; }
.setdots i.ok { background: var(--volt); }
.setdots i.now { background: #fff; }
/* rest */
.rest { min-height: 100vh; min-height: 100dvh; background: #000; color: #fff; display: grid; align-content: center; justify-items: center; gap: 22px; padding: 24px 20px calc(24px + env(safe-area-inset-bottom)); text-align: center; }
.rest .lab { font-family: var(--display); font-size: 28px; letter-spacing: .04em; color: #a1a1a3; }
.rest svg .tr { stroke: #262626; }
.rest svg text { fill: #fff; font-family: var(--display); }
.rest .next { display: grid; grid-template-columns: 96px 1fr; gap: 12px; align-items: center; background: #161616; border-radius: 16px; padding: 10px; text-align: left; width: 100%; max-width: 420px; }
.rest .next img { width: 96px; height: auto; aspect-ratio: 3 / 2; object-fit: cover; border-radius: 10px; }
.rest .next small { color: var(--volt); font-weight: 700; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; }
.rest .ctrl { display: flex; gap: 10px; }
.rest .ctrl button { min-width: 72px; min-height: 48px; border-radius: 999px; background: #1a1a1a; color: #fff; font-weight: 700; }
/* list mode */
.lx { background: #111; margin: 12px 12px 0; border-radius: 18px; overflow: hidden; display: grid; gap: 10px; padding-bottom: 12px; }
.lx > :not(.ph):not(button.lxp) { margin: 0 12px; }
.lxp { display: block; width: 100%; }
.thead, .row { display: grid; grid-template-columns: 30px minmax(0, 1.2fr) minmax(0, 1fr) minmax(0, 1fr) 44px; gap: 6px; align-items: center; }
.thead { font-size: 11px; font-weight: 700; color: #a1a1a3; letter-spacing: .06em; text-transform: uppercase; }
.row { border-radius: 10px; padding: 3px 2px; }
.row.done { background: rgba(212,255,58,.12); }
.row .n { text-align: center; font-weight: 700; }
.row .prev { font-size: 13px; color: #a1a1a3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row input { width: 100%; min-width: 0; height: 40px; border: 0; border-radius: 8px; background: #222; color: #fff; text-align: center; font-size: 16px; font-weight: 700; }
.row input::placeholder { color: #8a8a8c; }
.row .desc { grid-column: 2 / 5; font-size: 14px; font-weight: 600; }
.chk { width: 44px; height: 40px; border-radius: 8px; background: #222; display: grid; place-items: center; color: #8a8a8c; }
.chk svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.chk[aria-pressed="true"] { background: var(--volt); color: #111; }

/* sheets, dialogs */
.sheet { position: fixed; inset: 0; z-index: 60; background: var(--bg); color: var(--ink); overflow-y: auto; }
.sheet.dark { --bg: #000; --ink: #fff; --muted: #a1a1a3; --line: #2b2b2b; --soft: #161616; --card: #111; --btn: #fff; --btn-ink: #111; }
.sheet .in { max-width: 620px; margin: 0 auto; padding: calc(10px + env(safe-area-inset-top)) 16px calc(30px + env(safe-area-inset-bottom)); display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
.sheet .bar { display: flex; justify-content: space-between; align-items: center; }
.sheet .ph { border-radius: 18px; }
.steps { margin: 0; padding-left: 22px; display: grid; gap: 8px; }

.goalgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.gcard { text-align: left; border-radius: 16px; padding: 14px; background: var(--soft); display: grid; gap: 4px; box-shadow: inset 0 0 0 2px transparent; }

.gcard span { font-size: 13px; }
.gcard small { font-size: 12px; color: var(--muted); }
.gcard.on { background: var(--btn); color: var(--btn-ink); }
.gcard.on small { color: inherit; opacity: .75; }
.chips.wrap { flex-wrap: wrap; margin: 0; padding: 0; overflow: visible; }
.credit { text-align: center; font-size: 12px; color: var(--muted); }
.credit a { color: inherit; }
/* AI coach */
.aigrid { display: grid; gap: 8px; }
.ait { display: grid; justify-items: center; align-content: start; gap: 6px; padding: 14px 4px 12px; border-radius: 16px; background: var(--soft); text-align: center; }
.ait i { width: 46px; height: 46px; border-radius: 50%; background: var(--btn); color: var(--btn-ink); display: grid; place-items: center; }
.ait svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.ait b { font-size: 13px; line-height: 1.15; }
.ait small { font-size: 11px; color: var(--muted); line-height: 1.2; }
.aiimg { width: 100%; max-height: 46vh; object-fit: contain; border-radius: 18px; background: var(--soft); display: block; }
.aiimg.small { max-height: 26vh; }
.aiload { display: grid; justify-items: center; gap: 8px; padding: 18px 0; text-align: center; }
.spin { width: 34px; height: 34px; border-radius: 50%; border: 4px solid var(--line); border-top-color: var(--ink); animation: spin .8s linear infinite; }

@media (prefers-reduced-motion: reduce) { .spin { animation-duration: 2.4s; } }
.aiq { width: 100%; min-height: 84px; border: 0; border-radius: 14px; background: var(--card); box-shadow: inset 0 0 0 1.5px var(--line); padding: 12px 14px; font: inherit; font-size: 16px; resize: vertical; }
.ans { white-space: pre-wrap; font-size: 15px; }
.qa { display: grid; gap: 4px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.qa:last-child { border-bottom: 0; }
.blist { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.bigv { font-family: var(--display); font-size: 64px; line-height: 1; }
.kinds { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; text-align: center; }

.kinds b { font-size: 18px; } .kinds span { font-size: 11px; color: var(--muted); }

    return h + `<section class="sec"><div class="sec-h"><h2 class="D">Aniqlandi</h2><span class="xs muted">taxminiy</span></div>${r.items.length ? `<div>${r.items.map((x, i) => `<div class="li"><span class="grow"><b class="sm">${esc(x.n)}</b><small>${x.q ? esc(x.q) + " · " : ""}${f(x.p)} g oqsil · ${x.k} kkal</small></span><button type="button" class="x" data-act="aifoodx" data-i="${i}" aria-label="${esc(x.n)} — olib tashlash">×</button></div>`).join("")}</div>` : `<p class="sm muted">Hammasi olib tashlandi.</p>`}</section>
      <div class="stats" style="grid-template-columns:1fr 1fr"><div class="st"><b>${Math.round(tp)} g</b><span>oqsil</span></div><div class="st"><b>${big(tk)}</b><span>kkal</span></div></div>
      ${r.note ? `<p class="note">${esc(r.note)}</p>` : ""}
      ${r.items.length ? `<button type="button" class="pill block" data-act="aifoodadd" style="min-height:58px">Bugungi ovqatlarga qo'shish</button>` : ""}
      <p class="xs muted">Noto'g'ri aniqlangan bo'lsa, × bilan olib tashlang. Porsiya rasmdan taxmin qilinadi.</p></div></div>`;
  }
  if (r.photo_ok === false) return h + `<p class="note">${esc(r.photo_tip || "Tana yetarli ko'rinmayapti.")}</p>${retake}</div></div>`;
  const list = (title, L, ol) => L && L.length ? `<section class="sec"><h2 class="D">${title}</h2><${ol ? "ol" : "ul"} class="blist">${L.map(x => `<li>${esc(x)}</li>`).join("")}</${ol ? "ol" : "ul"}></section>` : "";
  const saved = s.saved || !!r.fid;
  return h + `${s.hist ? `<p class="sm muted">${human(r.d)}</p>` : ""}
    <div class="stats" style="grid-template-columns:1fr 1fr"><div class="st"><b>${esc(r.bf || "—")}</b><span>yog' (taxminiy)</span></div><div class="st"><b>${r.wt ? f1(r.wt) : f1(lastBW())}</b><span>kg, o'sha kungi vazn</span></div></div>
    ${r.summary ? `<p>${esc(r.summary)}</p>` : ""}
    ${list("Kuchli tomonlar", r.strong)}${list("Ustida ishlash kerak", r.work_on)}
    ${r.posture ? `<section class="sec"><h2 class="D">Qomat</h2><p class="sm">${esc(r.posture)}</p></section>` : ""}
    ${list("Nima qilamiz", r.tips, true)}
    ${s.blob && !saved ? `<button type="button" class="pill ghost block" data-act="aisavephoto">Progress fotolarga saqlash</button>` : saved && s.blob ? `<p class="sm muted">✓ Progress fotolarga saqlandi</p>` : ""}
    <p class="xs muted">AI bahosi taxminiy: yorug'lik, burchak va pump natijaga ta'sir qiladi. Real o'zgarish haftalarda ko'rinadi — haftada 1 marta, bir xil joy va yorug'likda suratga oling.</p></div></div>`;
}


/* ---------- state for views ---------- */
const app = document.getElementById("app"), overlay = document.getElementById("overlay");
let TAB = "bugun", SHEET = null, SUMMARY = null, DIALOG = null, MIN = false, REST = null, FILTER = "all", QUERY = "", LIFT = "bench";
const TABS = ["bugun", "mashqlar", "ovqat", "natija", "profil"];

function render() {
  if (S.active && !MIN) app.innerHTML = REST ? viewRest() : (S.settings.mode === "list" ? viewList() : viewFocus());
  else app.innerHTML = ({ mashqlar: viewLib, ovqat: viewFood, natija: viewStats, profil: viewProfile }[TAB] || viewHome)() + tabsHTML();
  renderOverlay();
  setSync();
}
function renderOverlay() {
  let h = "";
  if (SUMMARY) h += viewSummary();
  else if (SHEET) h += viewSheet();

  overlay.innerHTML = h;
  tgChrome(); hydratePhotos();
}
function tabsHTML() {
  const t = (id, label, icon) => `<a href="#${id}" aria-current="${TAB === id ? "page" : "false"}">${icon}${label}</a>`;
  return (S.active ? `<button type="button" class="resume" data-act="resume"><span>${esc(rname(S.active.k))} · <span data-dur>${dur(Date.now() - S.active.start)}</span></span><span>Davom etish ›</span></button>` : "") +
    `<nav class="tabs" aria-label="Bo'limlar"><div class="in">
    ${t("bugun", "Bugun", '<svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>')}
    ${t("mashqlar", "Mashqlar", '<svg viewBox="0 0 24 24"><path d="M6.5 6.5v11M17.5 6.5v11M3 9.5v5M21 9.5v5M6.5 12h11"/></svg>')}
    ${t("ovqat", "Ovqat", '<svg viewBox="0 0 24 24"><path d="M7 3v8a2 2 0 0 0 2 2v8M5 3v5M9 3v5M17 3c-1.7 0-3 2.2-3 5s1.3 4 3 4v9"/></svg>')}
    ${t("natija", "Natijalar", '<svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>')}
    ${t("profil", "Profil", '<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>')}

}

/* ---------- BUGUN ---------- */
function viewHome() {
  const t = todayISO(), w = weekNum(t), wd = parse(t).getDay(), k = w > 0 ? PLAN[wd] : null;
  let h = `<div class="page"><div class="top"><span class="sm muted">${WD[wd]}, ${human(t)}</span><span id="sync" class="sync"></span></div><h1 class="D">Salom, Javoxir</h1>
    <button type="button" class="planchip" data-act="plan"><span><small>Mening rejam</small><b>${G().name}${S.plan.focus !== "none" ? " · urg'u: " + focusName() : ""} · haftada ${S.plan.days} kun${S.plan.deload ? " · yengil hafta" : ""}</b></span><span aria-hidden="true">›</span></button>`;
  if (S.active) {
    const A = S.active;
    h += `<section class="hero">${photo(routineEx(A.k)[0] || "catcow")}<div class="hero-in"><span class="tag">Davom etmoqda</span><h2>${esc(rname(A.k))}</h2><p><span data-dur>${dur(Date.now() - A.start)}</span></p><button type="button" class="pill white block" data-act="resume">Davom etish</button></div></section>`;
  } else if (k && !doneOn(t)) {
    const ex = routineEx(k);
    h += `<section class="hero">${photo(ex[0])}<div class="hero-in"><span class="tag">Bugun · ${dayLabel(k)}</span><h2>${ROUT[k].name}</h2><p>${ex.length} mashq · ${routineSets(k, w)} set · ~${estMin(k, w)} daqiqa</p><button type="button" class="pill white block" data-act="start" data-k="${k}">Boshlash</button></div></section>`;
  } else if (doneOn(t)) {
    const wo = realWorkouts().filter(x => x.date === t).pop();
    h += `<section class="hero">${photo(routineEx(wo.k in ROUT ? wo.k : "R1")[0])}<div class="hero-in"><span class="tag">Bugun bajarildi ✓</span><h2>${esc(rname(wo.k))}</h2><p>${durWords(wo.end - wo.start)} · ${ton(wo.vol)} · ${(wo.prs || []).length} ta rekord</p>${postOn(t) ? "" : `<button type="button" class="pill white block" data-act="start" data-k="Q">Qomat mashqlari · 12 daq</button>`}</div></section>`;
  } else {
    const nd = [1, 2, 3, 4, 5, 6, 7].map(i => addDays(t, i)).find(d => weekNum(d) > 0 && PLAN[parse(d).getDay()]);
    h += `<section class="hero">${photo("catcow")}<div class="hero-in"><span class="tag">${w === 0 ? "Start: " + human(S.plan.start) : "Dam kuni"}</span><h2>Qomat mashqlari</h2><p>8 mashq · 12 daqiqa${wd === 3 ? " · + 30–40 daqiqa piyoda yuring" : ""}${nd ? `<br>Keyingi zal: ${WD[parse(nd).getDay()]} — ${ROUT[PLAN[parse(nd).getDay()]].name}` : ""}</p>
      ${postOn(t) ? `<button type="button" class="pill white block" disabled>Bugun bajarildi ✓</button>` : `<button type="button" class="pill white block" data-act="start" data-k="Q">Boshlash</button>`}</div></section>`;
  }
  h += aiHomeSection();
  // goals
  const GL = goals(t), gd = GL.filter(g => g.on).length;
  h += `<section class="sec"><div class="sec-h"><h2 class="D">Kunlik maqsad</h2></div><div class="box goals">${ring(gd, GL.length, 96, gd + "/" + GL.length)}<div class="gl">${GL.map(g => `<button type="button" class="gi ${g.on ? "on" : ""}" ${g.auto ? `data-act="goto" data-to="${g.id === "train" ? "bugun" : "ovqat"}"` : `data-act="habit" data-id="${g.id}"`} aria-pressed="${g.on}"><span class="c">${ICON.check}</span><span>${g.n}</span><small>${g.s}</small></button>`).join("")}</div></div></section>`;
  // week
  const ws = weekStart(t), wc = weekCount(ws), sw = streakWeeks();
  h += `<section class="sec"><div class="sec-h"><h2 class="D">Bu hafta · ${wc}/${S.plan.days}</h2><span class="sm muted">${w === 0 ? "start " + human(S.plan.start) : w + "-hafta" + (S.plan.deload ? " · yengil" : "")}</span></div><div class="week">${[0, 1, 2, 3, 4, 5, 6].map(i => {
    const d = addDays(ws, i), dw = parse(d).getDay(), plan = weekNum(d) > 0 && PLAN[dw], ok = doneOn(d);
    return `<div class="wd ${d === t ? "now" : ""}">${WD2[dw]}<i class="${ok ? "ok" : plan ? "plan" : ""}">${ok ? "✓" : parse(d).getDate()}</i><s class="${postOn(d) ? "p" : ""}"></s></div>`;
  }).join("")}</div>
  <p class="xs muted">Qora doira — zal kuni · sariq ✓ — bajarildi · yashil nuqta — qomat${sw ? ` · ${sw} hafta ketma-ket to'liq` : ""}</p></section>`;
  // plan carousel
  h += `<section class="sec"><div class="sec-h"><h2 class="D">Haftalik reja</h2><button type="button" class="link" data-act="plan">O'zgartirish</button></div><div class="car">${[...ORDER, "Q"].map(r => {
    const ex = routineEx(r), done = r !== "Q" && realWorkouts().some(x => x.k === r && weekStart(x.date) === ws);
    return `<button type="button" class="rc" data-act="routine" data-k="${r}"><span class="img">${thumb(ex[0])}<span class="day">${dayLabel(r)}</span>${done ? `<span class="ok">✓ bu hafta</span>` : ""}</span><b>${ROUT[r].name}</b><span class="sm muted">${ex.length} mashq · ~${estMin(r, Math.max(1, w))} daq</span></button>`;
  }).join("")}</div></section>`;
  // weekly check
  const st = weightStats();
  h += `<section class="sec"><div class="sec-h"><h2 class="D">Tana vazni</h2><a href="#natija">Grafik</a></div><div class="box"><div class="row2" style="align-items:end"><div class="field"><label for="wt">Bugun ertalab, kg</label><input id="wt" inputmode="decimal" data-act="wt" value="${dayRec(t).wt ? f(dayRec(t).wt) : ""}" placeholder="${f1(st.last ? st.last.y : BASE.wt)}"></div>
    <div class="sm muted" style="padding-bottom:12px">${st.avg7 ? `7 kun o'rtacha: <b style="color:var(--ink)">${f1(st.avg7)} kg</b><br>${st.avg7 - BASE.wt >= 0 ? "+" : ""}${f1(st.avg7 - BASE.wt)} kg boshidan` : "Boshlang'ich: 72 kg"}</div></div>${st.adv ? `<p class="note">${esc(st.adv.t)}</p>` : ""}</div></section>`;
  return h + `</div>`;
}

/* ---------- MASHQLAR ---------- */

    <div class="grid2">${list.map(e => `<button type="button" class="xc" data-act="ex" data-id="${e.id}">${thumb(e.id)}<b>${esc(e.uz)}</b><span>${esc(gName(e.g))}${inPlan.has(e.id) ? " · rejada" : ""}</span></button>`).join("") || `<p class="muted">Hech narsa topilmadi.</p>`}</div>

/* ---------- OVQAT ---------- */
function viewFood() {
  const t = todayISO(), ft = foodTotals(t), L = dayRec(t).food || [], wtr = dayRec(t).water || 0;
  const PROTEIN = PROT(), FAT = FATG(), carbs = Math.max(0, Math.round((S.kcal - PROTEIN * 4 - FAT * 9) / 4));
  return `<div class="page"><div class="top"><h1 class="D">Ovqat</h1><span id="sync" class="sync"></span></div>
    <div class="box" style="display:flex;justify-content:space-around;flex-wrap:wrap;gap:10px">
      <div style="display:grid;justify-items:center;gap:4px">${ring(ft.k, S.kcal, 140, big(ft.k), "/ " + big(S.kcal) + " kkal")}<b class="sm">Kaloriya</b></div>
      <div style="display:grid;justify-items:center;gap:4px">${ring(ft.p, PROTEIN, 140, Math.round(ft.p) + "g", "/ " + PROTEIN + " g")}<b class="sm">Oqsil</b></div></div>
    <p class="sm muted">${ft.p >= PROTEIN ? "Oqsil me'yori bajarildi." : `Oqsilga yana ${Math.round(PROTEIN - ft.p)} g.`} ${ft.k < S.kcal ? `Kaloriyaga yana ${big(S.kcal - ft.k)} kkal.` : `Me'yordan ${big(ft.k - S.kcal)} kkal oshdi.`}</p>
    <section class="sec"><div class="sec-h"><h2 class="D">Suv · ${f(wtr * 0.25)} / 2,5 l</h2></div><div class="water">${Array.from({ length: 10 }, (_, i) => `<button type="button" class="${i < wtr ? "on" : ""}" data-act="water" data-n="${i + 1}" aria-label="${(i + 1) * 250} ml"></button>`).join("")}</div><p class="xs muted">Har stakan — 250 ml. Bosing.</p></section>
    <section class="sec"><div class="sec-h"><h2 class="D">Tez qo'shish</h2><span class="xs muted">qiymatlar taxminiy</span></div>
      ${aiOn() ? `<button type="button" class="pill block" data-act="aipick" data-k="food">Rasmdan aniqlash · AI</button>` : ""}
      <div class="foods">${FOODS.map((x, i) => `<button type="button" class="food" data-act="food" data-i="${i}"><b>${esc(x.n)}</b><small>${esc(x.q)} · ${x.p} g · ${x.k} kkal</small></button>`).join("")}</div>
      <form id="foodForm" class="row3"><div class="field"><label for="fn">Boshqa</label><input id="fn" name="n" placeholder="Nomi"></div><div class="field"><label for="fk">kkal</label><input id="fk" name="k" inputmode="numeric"></div><div class="field"><label for="fp">Oqsil, g</label><input id="fp" name="p" inputmode="decimal"></div><button type="submit" class="pill sm" style="grid-column:1/-1">Qo'shish</button></form></section>
    <section class="sec"><div class="sec-h"><h2 class="D">Bugun yeganlarim</h2><span class="sm muted">${L.length}</span></div>
      <div>${L.length ? L.map((x, i) => `<div class="li"><span class="grow"><b class="sm">${esc(x.n)}</b><small>${x.q ? esc(x.q) + " · " : ""}${Math.round(x.p)} g oqsil · ${x.k} kkal</small></span><button type="button" class="x" data-act="unfood" data-i="${i}" aria-label="O'chirish">×</button></div>`).join("") : `<p class="sm muted">Hali hech narsa qo'shilmagan.</p>`}</div></section>
    <section class="sec"><div class="sec-h"><h2 class="D">Kunlik me'yor</h2><span class="seg"><button type="button" data-act="kcal" data-d="-50" aria-label="50 kkal kamaytirish">−50</button><button type="button" data-act="kcal" data-d="50" aria-label="50 kkal oshirish">+50</button></span></div>
      <div class="tbl"><table><thead><tr><th>Makro</th><th>g/kun</th><th>kkal</th></tr></thead><tbody><tr><td>Oqsil</td><td>${PROTEIN}</td><td>${PROTEIN * 4}</td></tr><tr><td>Yog'</td><td>${FAT}</td><td>${FAT * 9}</td></tr><tr><td>Uglevod</td><td>${carbs}</td><td>${carbs * 4}</td></tr><tr><td><b>Jami</b></td><td></td><td><b>${big(S.kcal)}</b></td></tr></tbody></table></div>
      <p class="xs muted">Maqsad «${G().name}»: saqlash ~${big(tdee())} kkal ${G().kcal >= 0 ? "+" : "−"} ${Math.abs(G().kcal)} = ${big(kcalBase())} kkal. Oqsil ${G().prot.toString().replace(".", ",")} g/kg. Har 2 haftada Natijalar → Tana vazni tavsiyasi bo'yicha to'g'rilang.</p></section></div>`;
}

/* ---------- NATIJALAR ---------- */
function viewStats() {
  const L = realWorkouts(), t = todayISO(), wk = weekNum(t), tv = totalVol(), mins = L.reduce((a, w) => a + (w.end - w.start), 0);
  let h = `<div class="page"><div class="top"><h1 class="D">Natijalar</h1><span id="sync" class="sync"></span></div>
    <div class="stats four"><div class="st"><b>${L.length}</b><span>mashg'ulot</span></div><div class="st"><b>${ton(tv)}</b><span>jami ko'tarildi</span></div><div class="st"><b>${f(Math.round(mins / 3600000 * 10) / 10)}</b><span>soat zalda</span></div><div class="st"><b>${totalPRs()}</b><span>rekord</span></div></div>`;
  const W0 = weekStart(t), wks = Array.from({ length: 12 }, (_, i) => addDays(W0, -7 * (11 - i)));
  const vols = wks.map(ws => L.filter(w => weekStart(w.date) === ws).reduce((a, w) => a + w.vol, 0)), mx = Math.max(...vols, 1);
  let bars = ""; vols.forEach((v, i) => { const hg = v ? Math.max(4, v / mx * 100) : 4, x = 8 + i * 27; bars += `<rect class="bar ${v ? (i === 11 ? "now" : "") : "z"}" x="${x}" y="${118 - hg}" width="19" height="${hg}" rx="4"/>${i % 3 === 2 || i === 11 ? `<text x="${x + 9.5}" y="134" text-anchor="middle">${i === 11 ? "bu" : short(wks[i]).split("-")[0]}</text>` : ""}`; if (v === mx && v) bars += `<text class="endlab" x="${x + 9.5}" y="${112 - hg}" text-anchor="middle">${v >= 1000 ? f(Math.round(v / 100) / 10) + "t" : big(v)}</text>`; });
  h += `<section class="sec"><div class="sec-h"><h2 class="D">Haftalik hajm</h2><span class="xs muted">kg · oxirgi 12 hafta</span></div><svg class="chart" viewBox="0 0 332 140" role="img" aria-label="Haftalik ko'tarilgan vazn">${bars}</svg><p class="xs muted">Har ustun — bir hafta (raqam — o'sha haftaning dushanbasi). Sariq — shu hafta.</p></section>`;
  const lp = []; S.workouts.forEach(w => { const x = w.ex.find(z => z.id === LIFT); if (x && x.sets.length) { const b = Math.max(...x.sets.map(s => e1rm(s.w || 0, s.r))); if (b > 0) lp.push({ x: dayDiff(EPOCH, w.date), y: b, d: w.date }); } });
  h += `<section class="sec"><div class="sec-h"><h2 class="D">Kuch</h2><span class="xs muted">1 marta maksimum, kg (taxm.)</span></div><div class="chips">${MAIN.map(id => `<button type="button" class="chip" data-act="lift" data-id="${id}" aria-pressed="${LIFT === id}">${esc(X[id].en)}</button>`).join("")}</div>
    ${lineChart(lp, { label: X[LIFT].uz, empty: `${esc(X[LIFT].uz)}: grafik uchun kamida 2 ta mashg'ulot kerak. Hozirgi maqsad: ${f(S.prog[LIFT].w)} kg × ${S.prog[LIFT].r}.` })}
    ${lp.length > 1 ? `<p class="sm">Boshidan beri: <b class="${lp[lp.length - 1].y >= lp[0].y ? "pos" : "neg"}">${lp[lp.length - 1].y >= lp[0].y ? "+" : ""}${f1((lp[lp.length - 1].y / lp[0].y - 1) * 100)}%</b> · maqsad ${f(S.prog[LIFT].w)} kg × ${S.prog[LIFT].r}</p>` : ""}</section>`;
  const st = weightStats(), avg = st.E.map(e => { const win = st.E.filter(z => dayDiff(z.d, e.d) >= 0 && dayDiff(z.d, e.d) < 7); return { x: dayDiff(EPOCH, e.d), y: win.reduce((a, z) => a + z.y, 0) / win.length, d: e.d }; });
  h += `<section class="sec"><div class="sec-h"><h2 class="D">Tana vazni</h2><span class="xs muted">kg</span></div>${lineChart(st.E.map(e => ({ x: dayDiff(EPOCH, e.d), y: e.y, d: e.d })), { line2: avg, label: "Tana vazni", empty: "Bugun bo'limida har kuni ertalab vazningizni yozing — grafik shu yerda chiqadi." })}
    <div class="stats"><div class="st"><b>${f1(BASE.wt)}</b><span>boshida</span></div><div class="st"><b>${st.avg7 ? f1(st.avg7) : "—"}</b><span>7 kun o'rt.</span></div><div class="st"><b>${st.perMonth !== undefined ? (st.perMonth >= 0 ? "+" : "") + f1(st.perMonth) : "—"}</b><span>kg / oy</span></div></div>

/* ---------- player: focus ---------- */
function curPos() {
  const A = S.active; let i = Math.min(A.cur || 0, A.ex.length - 1);
  let j = A.ex[i].sets.findIndex(s => !s.d);
  return { i, j };
}
function setVal(i, j, key) {
  const A = S.active, x = A.ex[i], e = X[x.id], s = x.sets[j], tg = target(e, weekNum(A.date));
  if (s && s[key] != null) return s[key];
  for (let k = j - 1; k >= 0; k--) if (x.sets[k].d && x.sets[k][key] != null) return x.sets[k][key];
  return key === "w" ? tg.w : tg.r;
}
function playerTop(i) {
  const A = S.active;
  return `<div class="pl-top"><button type="button" class="ib" data-act="minimize" aria-label="Yig'ish">${ICON.down}</button>
    <div class="segs" style="grid-template-columns:repeat(${A.ex.length},1fr)">${A.ex.map((x, k) => `<button type="button" class="${x.sets.every(s => s.d) ? "ok" : k === i ? "now" : ""}" data-act="jump" data-i="${k}" aria-label="${k + 1}-mashq"></button>`).join("")}</div>

    <div class="pl-meta"><span>${esc(rname(A.k))}</span><span><b data-dur>${dur(Date.now() - A.start)}</b> · ${activeStats().sets}/${activeStats().total} set</span></div>`;
}

      <button type="button" class="pill ghost block" data-act="warmdone">O'tkazib yuborish</button></div></div>`;

  }
  h += `<button type="button" class="pill ghost block" data-act="finish" style="margin-top:6px">Mashg'ulotni tugatish</button></div></div>`;

function activeStats() {
  const A = S.active; let sets = 0, total = 0, vol = 0, ex = 0;
  A.ex.forEach(x => { const e = X[x.id]; let all = true; x.sets.forEach(s => { total++; if (s.d) { sets++; vol += (s.w || 0) * (s.r || 0) * volMul(e); } else all = false; }); if (all) ex++; });
  return { sets, total, vol, ex };
}

  const rows = [["Sana", "Mashg'ulot", "Mashq", "Set", "kg", "Takror"]];
  S.workouts.forEach(w => w.ex.forEach(x => x.sets.forEach((s, j) => rows.push([w.date, rname(w.k), X[x.id] ? X[x.id].uz : x.id, j + 1, String(s.w || 0).replace(".", ","), s.r]))));
  return "﻿" + rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(";")).join("\r\n");
}

document.addEventListener("input", ev => {
  const el = ev.target;
  if (el.dataset.in && S.active) { const s = S.active.ex[+el.dataset.i].sets[+el.dataset.j], v = num(el.value); if (el.dataset.in === "r") s.r = v === null ? null : Math.round(v); else s.w = v; touch(1500); }
  else if (el.id === "aiQ") AIQ = el.value;
  else if (el.dataset.act === "q") { QUERY = el.value; const pos = el.selectionStart; render(); const q = document.getElementById("q"); if (q) { q.focus(); try { q.setSelectionRange(pos, pos); } catch (e) { /* ignore */ } } }
});
document.addEventListener("change", ev => {
  const el = ev.target, t = todayISO();
  if (el.dataset.act === "wt") { const v = num(el.value), d = dayRec(t, true); if (v && v > 30 && v < 250) d.wt = v; else delete d.wt; touch(); render(); }
  else if (el.id === "photoIn") { uploadPhoto(el.files && el.files[0]); el.value = ""; }
  else if (el.id === "aiIn") { const fl = el.files && el.files[0]; el.value = ""; aiPhoto(AIKIND, fl); }
});
document.addEventListener("submit", ev => {
  ev.preventDefault();
  const t = todayISO(), fd = new FormData(ev.target);
  if (ev.target.id === "foodForm") { const n = String(fd.get("n") || "").trim() || "Boshqa", k = num(fd.get("k")) || 0, p = num(fd.get("p")) || 0; if (!k && !p) return; (dayRec(t, true).food = dayRec(t, true).food || []).push({ n, p, k: Math.round(k) }); touch(); render(); }
  else if (ev.target.id === "aiForm") { aiAsk(fd.get("q")); }
  else if (ev.target.id === "importForm") {
    let j = null; try { j = JSON.parse(String(fd.get("j") || "").trim()); } catch (e) { j = null; }
    if (!j || typeof j !== "object" || !(j.v >= 3) || !Array.isArray(j.workouts)) { toast("Matn zaxira nusxaga o'xshamaydi"); return; }
    ask("Tiklansinmi?", `${j.workouts.length} ta mashg'ulot va ${Object.keys(j.days || {}).length} kunlik yozuv tiklanadi. Hozirgi ma'lumotlar almashtiriladi.`, [{ t: "Tiklash", fn: () => { S = normalize(j); applyTheme(); SHEET = null; touch(); toast("Tiklandi"); } }, { t: "Yo'q", cls: "ghost" }]);
  }
  else if (ev.target.id === "measForm") { const m = {}; ["waist", "chest", "arm", "thigh", "height"].forEach(k => { const v = num(fd.get(k)); if (v && v > 0) m[k] = v; }); if (Object.keys(m).length) S.meas[t] = m; else delete S.meas[t]; touch(); render(); toast("O'lchov saqlandi"); }
});
document.addEventListener("click", ev => {
  const b = ev.target.closest("[data-act]"); if (!b || b.tagName === "INPUT" || b.disabled) return;
  const a = b.dataset.act, t = todayISO();
  const H = {
    start: () => { const k = b.dataset.k; if (S.active) return ask("Mashg'ulot davom etmoqda", `${rname(S.active.k)} hali tugatilmagan.`, [{ t: "Davom etish", fn: () => { MIN = false; SHEET = null; } }, { t: "Bekor qilib, yangisini boshlash", cls: "ghost", fn: () => { S.active = null; startWorkout(k); } }]); startWorkout(k); },
    resume: () => { MIN = false; wake(true); render(); scrollTop(); },
    minimize: () => { MIN = true; REST = null; wake(false); render(); },
    goto: () => { location.hash = "#" + b.dataset.to; },
    habit: () => { const d = dayRec(t, true); d.habit = d.habit || {}; d.habit[b.dataset.id] = !d.habit[b.dataset.id]; touch(); render(); },
    routine: () => { SHEET = { type: "routine", k: b.dataset.k }; renderOverlay(); },
    ex: () => { SHEET = { type: "ex", id: b.dataset.id }; renderOverlay(); const s = overlay.querySelector(".sheet"); if (s) s.scrollTop = 0; },
    close: () => { aiClose(); render(); },
    aipick: () => { if (!aiOn() || !aiCapOk()) return; AIKIND = b.dataset.k; document.getElementById("aiIn").click(); },
    aihub: () => {
      const k = b.dataset.k;
      if (!(SHEET && SHEET.type === "ai")) { SHEET = { type: "ai" }; renderOverlay(); const sh = overlay.querySelector(".sheet"); if (sh) sh.scrollTop = 0; }
      if (k === "use") { const u = document.getElementById("aiuse"); if (u) u.scrollIntoView(); }
      else if (k === "ask") { const q = document.getElementById("aiQ"); if (q) q.focus(); }
    },
    aistop: () => { if (AICTL) { AICTL.abort(); AICTL = null; } AIA = null; renderKeep(); },
    aiqchip: () => aiAsk(QCHIPS[+b.dataset.i]),
    aicap: () => { S.ai.cap = +b.dataset.v; touch(); renderKeep(); },
    aiwsave: () => { const v = num((document.getElementById("aiw") || {}).value); if (!(v > 30 && v < 250)) return toast("Vaznni to'g'ri kiriting"); dayRec(t, true).wt = Math.round(v * 10) / 10; aiClose(); SHEET = null; touch(); render(); toast(`Vazn saqlandi: ${f1(v)} kg`); },
    aifoodx: () => { SHEET.r.items.splice(+b.dataset.i, 1); renderKeep(); },
    aifoodadd: () => { const L = dayRec(t, true).food = dayRec(t, true).food || [], it = SHEET.r.items, tp = it.reduce((a, x) => a + x.p, 0); it.forEach(x => L.push({ n: x.n, q: x.q, p: x.p, k: x.k })); aiClose(); SHEET = null; touch(); if (location.hash !== "#ovqat") location.hash = "#ovqat"; else render(); toast(`${it.length} ta qo'shildi · +${Math.round(tp)} g oqsil`); },
    aibody: () => { const z = S.ai.body.find(x => String(x.ts) === b.dataset.ts); if (!z) return; SHEET = { type: "aires", kind: "body", st: "ok", r: z, hist: true, back: { type: "ai" } }; renderOverlay(); const sh = overlay.querySelector(".sheet"); if (sh) sh.scrollTop = 0; },
    aisavephoto: async () => { const s = SHEET; if (!s || !s.blob || s.busy) return; s.busy = true; toast("Saqlanmoqda…"); try { const fid = await sendPhoto(s.blob, "Tana tahlili · " + human(todayISO())); const en = S.ai.body.find(z => z.ts === s.ts); if (en) { en.fid = fid; touch(); } s.saved = true; renderKeep(); toast("Progress fotolarga saqlandi"); } catch (e) { toast((e && e.message) || "Saqlanmadi"); } s.busy = false; },
    airetry: () => { const s = SHEET; if (s && s.blob) aiPhoto(s.kind, s.blob); },
    import: () => { SHEET = { type: "import" }; renderOverlay(); },
    filter: () => { FILTER = b.dataset.g; render(); },
    water: () => { const d = dayRec(t, true), n = +b.dataset.n; d.water = (d.water || 0) === n ? n - 1 : n; touch(); render(); },
    food: () => { const x = FOODS[+b.dataset.i]; (dayRec(t, true).food = dayRec(t, true).food || []).push({ n: x.n, q: x.q, p: x.p, k: x.k }); touch(); render(); toast(`${x.n} qo'shildi · +${x.p} g oqsil`); },
    unfood: () => { (dayRec(t, true).food || []).splice(+b.dataset.i, 1); touch(); render(); },
    kcal: () => { S.kcal = Math.max(1600, Math.min(4500, S.kcal + (+b.dataset.d))); touch(); render(); },
    lift: () => { LIFT = b.dataset.id; render(); },
    wo: () => { SHEET = { type: "wo", i: +b.dataset.i }; renderOverlay(); },
    delwo: () => ask("O'chirilsinmi?", "Bu mashg'ulot tarixdan o'chadi. Vazn maqsadlari o'zgarmaydi.", [{ t: "O'chirish", cls: "danger", fn: () => { S.workouts.splice(+b.dataset.i, 1); SHEET = null; touch(); } }, { t: "Yo'q", cls: "ghost" }]),
    addphoto: () => document.getElementById("photoIn").click(),
    photo: () => { SHEET = { type: "photo", id: b.dataset.id }; renderOverlay(); },
    compare: () => { SHEET = { type: "compare" }; renderOverlay(); },
    delphoto: () => ask("Foto ilovadan o'chirilsinmi?", "Foto ro'yxatdan olib tashlanadi. Bot chatidagi nusxani bot 48 soat ichida o'chira oladi, undan keyin o'zingiz o'chirasiz.", [{ t: "O'chirish", cls: "danger", fn: async () => { const id = b.dataset.id, p = S.photos.find(z => z.fid === id); S.photos = S.photos.filter(z => z.fid !== id); S.ai.body.forEach(z => { if (z.fid === id) delete z.fid; }); SHEET = null; touch(); try { if (p && p.mid) await api("/api/send", { type: "delete", mid: p.mid }); } catch (e) { /* stays in chat */ } } }, { t: "Yo'q", cls: "ghost" }]),
    theme: () => { S.settings.theme = b.dataset.v; applyTheme(); touch(); render(); },
    mode: () => { S.settings.mode = b.dataset.v; touch(); render(); },
    set: () => { const k = b.dataset.k; S.settings[k] = !S.settings[k]; touch(); render(); },
    csv: async () => { toast("Yuborilmoqda…"); try { const data = await b64(new Blob([csv()], { type: "text/csv" })); await api("/api/send", { type: "doc", data, name: "javoxir-gym-tarix-" + todayISO() + ".csv", mime: "text/csv", caption: "Mashg'ulotlar tarixi" }); toast("Fayl bot chatiga yuborildi"); } catch (e) { toast((e && e.message) || "Yuborilmadi"); } },
    copy: () => { try { navigator.clipboard.writeText(JSON.stringify(S)).then(() => toast("Nusxalandi — Telegram «Saqlangan»ga joylang"), () => toast("Brauzer ruxsat bermadi")); } catch (e) { toast("Brauzer ruxsat bermadi"); } },
    reset: () => ask("Hammasi o'chirilsinmi?", "Mashg'ulotlar, vazn, ovqat va o'lchovlar o'chadi (progress fotolar qoladi). Qaytarib bo'lmaydi.", [{ t: "Ha, o'chirish", cls: "danger", fn: () => { const keepPhotos = S.photos; S = normalize(null); S.photos = keepPhotos; touch(); toast("Ma'lumotlar o'chirildi"); } }, { t: "Yo'q", cls: "ghost" }]),
    dlg: () => { const btn = DIALOG.btns[+b.dataset.i]; DIALOG = null; Promise.resolve(btn.fn && btn.fn()).then(() => render()); },
    closesum: () => { SUMMARY = null; location.hash = "#bugun"; render(); scrollTop(); },
    swapplan: () => { SHEET = { type: "swap", plan: true, k: b.dataset.k, i: +b.dataset.i }; renderOverlay(); },
    resetplan: () => { delete S.routines[b.dataset.k]; touch(); renderOverlay(); render(); },
    swap: () => { SHEET = { type: "swap", plan: false, k: S.active.k, i: +b.dataset.i, perm: false }; renderOverlay(); },
    swapperm: () => { SHEET.perm = !SHEET.perm; renderOverlay(); },
    doswap: () => {
      const s = SHEET, id = b.dataset.id, w = weekNum(t);
      if (s.plan || s.perm) { const L = routineEx(s.k).slice(); const old = s.plan ? L[s.i] : S.active.ex[s.i].id; const pi = L.indexOf(old); if (pi >= 0) { L[pi] = id; S.routines[s.k] = L; } }
      if (!s.plan && S.active) { S.active.ex[s.i] = { id, sets: Array.from({ length: setsFor(X[id], w) }, () => ({ w: null, r: null, d: false })) }; S.active.cur = s.i; }
      SHEET = s.plan ? { type: "routine", k: s.k } : null; touch(); render(); toast(`${X[id].uz} tanlandi`);
    },
    plan: () => { SHEET = { type: "plan", d: { goal: S.plan.goal, focus: S.plan.focus, days: S.plan.days, start: "keep", keep: true } }; renderOverlay(); const sh = overlay.querySelector(".sheet"); if (sh) sh.scrollTop = 0; },
    pd: () => { const f0 = b.dataset.f, v = b.dataset.v; SHEET.d[f0] = f0 === "days" ? +v : f0 === "keep" ? v === "true" : v; const sh = overlay.querySelector(".sheet"), y = sh ? sh.scrollTop : 0; renderOverlay(); const s2 = overlay.querySelector(".sheet"); if (s2) s2.scrollTop = y; },
    plansave: () => {
      const d = SHEET.d, t0 = todayISO(), old = S.plan;
      const start = d.start === "today" ? t0 : d.start === "monday" ? nextMonday(t0) : old.start;
      if (d.days !== old.days || d.focus !== old.focus) S.routines = {};
      S.plan = { goal: d.goal, focus: d.focus, days: d.days, start, deload: false };
      Object.values(X).forEach(e => { if (e.kind === "post") return; if (!d.keep) S.prog[e.id] = { w: isW(e) ? e.sw : 0, r: 0 }; else if (d.goal !== old.goal) S.prog[e.id] = { w: S.prog[e.id].w, r: 0 }; });
      S.active = null; REST = null; MIN = false; buildPlan(S.plan); S.kcal = kcalBase();
      SHEET = null; touch(); render(); scrollTop(); toast("Reja saqlandi");
    },
    deload: () => { S.plan.deload = !S.plan.deload; touch(); render(); toast(S.plan.deload ? "Yengil hafta yoqildi" : "Odatiy rejaga qaytildi"); },
    togglemode: () => { S.settings.mode = S.settings.mode === "list" ? "focus" : "list"; touch(); render(); scrollTop(); },
    jump: () => { S.active.cur = +b.dataset.i; if (S.settings.mode === "list") S.settings.mode = "focus"; REST = null; touch(); render(); },
    jumpfocus: () => { S.active.cur = +b.dataset.i; S.settings.mode = "focus"; touch(); render(); scrollTop(); },
    warmdone: () => { S.active.warm = true; touch(); render(); },
    step: () => {
      const { i, j } = curPos(); if (j < 0) return;
      const x = S.active.ex[i], e = X[x.id], s = x.sets[j], d = +b.dataset.d;
      if (b.dataset.k === "w") s.w = Math.max(minW(e), roundTo(setVal(i, j, "w") + d * e.inc, e.inc));
      else s.r = Math.max(1, setVal(i, j, "r") + d * (e.unit === "soniya" ? 5 : 1));
      touch(1500); render();
    },
    doneSet: () => { unlockAudio(); const { i, j } = curPos(); if (j < 0) return; markSet(i, j); touch(); afterSet(i); render(); scrollTop(); },
    nextex: () => { const { i } = curPos(), ni = nextUndone(i); if (ni >= 0) { S.active.cur = ni; touch(); render(); scrollTop(); } else H.finish(); },
    prevex: () => { const A = S.active; A.cur = Math.max(0, (A.cur || 0) - 1); render(); scrollTop(); },
    undoLast: () => { const x = S.active.ex[+b.dataset.i]; for (let k = x.sets.length - 1; k >= 0; k--) if (x.sets[k].d) { x.sets[k].d = false; break; } touch(); render(); },
    chk: () => { unlockAudio(); const i = +b.dataset.i, j = +b.dataset.j, s = S.active.ex[i].sets[j]; if (s.d) { s.d = false; touch(); render(); return; } markSet(i, j, { w: s.w, r: s.r }); touch(); const x = S.active.ex[i]; if (X[x.id].kind !== "post" && (x.sets.some(z => !z.d) || nextUndone(i) >= 0)) { S.active.cur = i; startRest(X[x.id].rest, null); REST.inList = true; } render(); },
    addset: () => { const x = S.active.ex[+b.dataset.i], l = x.sets[x.sets.length - 1] || {}; x.sets.push({ w: l.w ?? null, r: l.r ?? null, d: false }); touch(); render(); },
    rest: () => { const d = +b.dataset.d; if (!REST) return; if (d === 0) { REST = null; } else { REST.end = Math.max(Date.now(), REST.end + d * 1000); REST.total = Math.max(1, REST.total + d); if (REST.end > Date.now()) REST.rang = false; } render(); },
    finish: () => { const st = activeStats(); if (st.sets === 0) return ask("Hali hech narsa bajarilmagan", "Kamida bitta setni bajaring yoki mashg'ulotni bekor qiling.", [{ t: "Davom etish" }, { t: "Bekor qilish", cls: "danger", fn: () => { S.active = null; REST = null; touch(); wake(false); } }]); if (st.sets < st.total) return ask("Tugatilsinmi?", `${st.total - st.sets} ta set bajarilmagan. Faqat bajarilganlari saqlanadi.`, [{ t: "Tugatish", fn: finishWorkout }, { t: "Davom etish", cls: "ghost" }]); finishWorkout(); },
    discard: () => ask("Bekor qilinsinmi?", "Bu mashg'ulotdagi belgilar o'chadi.", [{ t: "Bekor qilish", cls: "danger", fn: () => { S.active = null; REST = null; touch(); wake(false); } }, { t: "Davom etish", cls: "ghost" }])
  };
  if (H[a]) H[a]();
});
setInterval(() => {
  if (S.active) document.querySelectorAll("[data-dur]").forEach(el => { el.textContent = dur(Date.now() - S.active.start); });
  if (REST && S.active && !MIN) {
    const left = Math.max(0, Math.ceil((REST.end - Date.now()) / 1000)), tEl = document.getElementById("restT"), arc = document.getElementById("restArc");
    if (tEl) tEl.textContent = dur(left * 1000);
    if (arc) { const c = 2 * Math.PI * 104; arc.setAttribute("stroke-dasharray", `${(c * (REST.total ? left / REST.total : 0)).toFixed(1)} ${c.toFixed(1)}`); }
    if (left === 0 && !REST.rang) { REST.rang = true; beep(); const mine = REST; setTimeout(() => { if (REST === mine) { REST = null; render(); } }, REST.inList ? 1500 : 2500); }
  }
}, 250);
function route() { const h = (location.hash || "").replace("#", ""); TAB = TABS.includes(h) ? h : "bugun"; if (S.active) { MIN = true; REST = null; } SHEET = null; render(); scrollTop(); }
window.addEventListener("hashchange", route);
document.addEventListener("visibilitychange", () => { if (document.hidden) { if (dirty) flush(); } else { if (S.active && !MIN) wake(true); if (!S.active) render(); } });
if (location.hash && TABS.includes(location.hash.slice(1))) TAB = location.hash.slice(1);
applyTheme(); render(); tgInit();
window.addEventListener("pagehide", () => { if (dirty) flush(); });
</script>
